name: imperator

services:
  postgres:
    image: imperator/postgres:${IMPERATOR_IMAGE_TAG:?Set IMPERATOR_IMAGE_TAG to the current Git SHA}
    platform: linux/amd64
    build:
      context: ./postgresql
      dockerfile: Dockerfile
      args:
        VCS_REF: ${IMPERATOR_IMAGE_TAG:?Set IMPERATOR_IMAGE_TAG to the current Git SHA}
    environment:
      POSTGRES_DB: imperator
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-owner-password
      POSTGRES_USER: imperator_owner
    secrets:
      - postgres-owner-password
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - data-internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --host=127.0.0.1 --username=imperator_owner --dbname=imperator
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/run/postgresql:size=16m,uid=999,gid=999,mode=0775
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 1024m
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  flyway-migrate:
    image: imperator/flyway:${IMPERATOR_IMAGE_TAG:?Set IMPERATOR_IMAGE_TAG to the current Git SHA}
    platform: linux/amd64
    build:
      context: ./flyway
      dockerfile: Dockerfile
      args:
        VCS_REF: ${IMPERATOR_IMAGE_TAG:?Set IMPERATOR_IMAGE_TAG to the current Git SHA}
    entrypoint:
      - /bin/sh
      - /opt/imperator/entrypoint.sh
    command:
      - migrate
    environment:
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_URL: jdbc:postgresql://postgres:5432/imperator
      FLYWAY_USER: imperator_owner
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    secrets:
      - postgres-owner-password
    volumes:
      - type: bind
        source: ../../database/migrations
        target: /flyway/sql
        read_only: true
      - type: bind
        source: ./flyway/entrypoint.sh
        target: /opt/imperator/entrypoint.sh
        read_only: true
    networks:
      - data-internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  flyway-validate:
    image: imperator/flyway:${IMPERATOR_IMAGE_TAG:?Set IMPERATOR_IMAGE_TAG to the current Git SHA}
    platform: linux/amd64
    build:
      context: ./flyway
      dockerfile: Dockerfile
      args:
        VCS_REF: ${IMPERATOR_IMAGE_TAG:?Set IMPERATOR_IMAGE_TAG to the current Git SHA}
    entrypoint:
      - /bin/sh
      - /opt/imperator/entrypoint.sh
    command:
      - validate
    environment:
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_URL: jdbc:postgresql://postgres:5432/imperator
      FLYWAY_USER: imperator_owner
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    secrets:
      - postgres-owner-password
    volumes:
      - type: bind
        source: ../../database/migrations
        target: /flyway/sql
        read_only: true
      - type: bind
        source: ./flyway/entrypoint.sh
        target: /opt/imperator/entrypoint.sh
        read_only: true
    networks:
      - data-internal
    depends_on:
      flyway-migrate:
        condition: service_completed_successfully
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  postgres-permissions:
    image: imperator/postgres:${IMPERATOR_IMAGE_TAG:?Set IMPERATOR_IMAGE_TAG to the current Git SHA}
    platform: linux/amd64
    build:
      context: ./postgresql
      dockerfile: Dockerfile
      args:
        VCS_REF: ${IMPERATOR_IMAGE_TAG:?Set IMPERATOR_IMAGE_TAG to the current Git SHA}
    user: "999:999"
    entrypoint:
      - /bin/sh
      - /opt/imperator/provision-app-role.sh
    secrets:
      - postgres-owner-password
      - postgres-app-password
    volumes:
      - type: bind
        source: ./postgresql/provision-app-role.sh
        target: /opt/imperator/provision-app-role.sh
        read_only: true
    networks:
      - data-internal
    depends_on:
      flyway-validate:
        condition: service_completed_successfully
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  backend:
    image: imperator/backend:${IMPERATOR_IMAGE_TAG:?Set IMPERATOR_IMAGE_TAG to the current Git SHA}
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: infra/docker/backend/Dockerfile
      args:
        VCS_REF: ${IMPERATOR_IMAGE_TAG:?Set IMPERATOR_IMAGE_TAG to the current Git SHA}
    environment:
      IMPERATOR_AWS_ENABLED: "false"
      IMPERATOR_GITHUB_ENABLED: "false"
      IMPERATOR_POSTGRESQL_ENABLED: "true"
      IMPERATOR_POSTGRESQL_URL: jdbc:postgresql://postgres:5432/imperator
      IMPERATOR_POSTGRESQL_USERNAME: imperator_app
      SERVER_PORT: "8080"
      SPRING_MAIN_BANNER_MODE: "off"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES: imperator-api
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${IMPERATOR_JWT_ISSUER_URI:?Set an HTTPS D087 issuer URI}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${IMPERATOR_JWT_JWK_SET_URI:?Set an HTTPS D087 JWKS URI}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWS_ALGORITHMS: RS256
    secrets:
      - postgres-app-password
    networks:
      - application-internal
      - data-internal
      - provider-egress
    depends_on:
      postgres-permissions:
        condition: service_completed_successfully
    expose:
      - "8080"
      - "9090"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          head -n 1 <&3 | grep -q " 200 "'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 1024m
    pids_limit: 160
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    image: imperator/frontend:${IMPERATOR_IMAGE_TAG:?Set IMPERATOR_IMAGE_TAG to the current Git SHA}
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: infra/docker/frontend/Dockerfile
      args:
        VCS_REF: ${IMPERATOR_IMAGE_TAG:?Set IMPERATOR_IMAGE_TAG to the current Git SHA}
    environment:
      HOSTNAME: 0.0.0.0
      IMPERATOR_API_ORIGIN: http://backend:8080
      IMPERATOR_RUNTIME_PROFILE: docker-compose
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
      PORT: "3000"
    networks:
      - application-internal
      - frontend-ingress
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 127.0.0.1:${IMPERATOR_HTTP_PORT:-3000}:3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/').then(response => {
            if (!response.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  prometheus:
    profiles:
      - observability
    image: prom/prometheus:v3.13.3-distroless@sha256:2e9a8ad75536755572d703e645fcc39c8104d9f0215d49d613db35194b0d8bc2
    platform: linux/amd64
    user: "65532:65532"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=256MB
      - --log.level=info
    volumes:
      - type: bind
        source: ./observability/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ./observability/prometheus/rules
        target: /etc/prometheus/rules
        read_only: true
      - type: bind
        source: ./observability/prometheus/tests
        target: /etc/prometheus/tests
        read_only: true
      - prometheus-data:/prometheus
    networks:
      - application-internal
      - observability-internal
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "9090"
    healthcheck:
      test:
        - CMD
        - /bin/promtool
        - check
        - ready
        - --url=http://127.0.0.1:9090
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=16m,uid=65532,gid=65532,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  grafana:
    profiles:
      - observability
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    platform: linux/amd64
    user: "472:0"
    environment:
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_SECURITY_ADMIN_USER: admin
      GF_SERVER_DOMAIN: localhost
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets:
      - grafana-admin-password
    volumes:
      - type: bind
        source: ./observability/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
      - type: bind
        source: ./observability/grafana/dashboards
        target: /etc/grafana/dashboards
        read_only: true
    networks:
      - observability-internal
      - frontend-ingress
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - 127.0.0.1:${IMPERATOR_GRAFANA_PORT:-3001}:3000
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=16m,uid=472,gid=0,mode=1777
      - /var/lib/grafana:size=64m,uid=472,gid=0,mode=0750
      - /var/log/grafana:size=16m,uid=472,gid=0,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  application-internal:
    internal: true
  data-internal:
    internal: true
  observability-internal:
    internal: true
  provider-egress: {}
  frontend-ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: 127.0.0.1

volumes:
  postgres-data:
  prometheus-data:

secrets:
  postgres-owner-password:
    file: ./secrets/postgres-owner-password
  postgres-app-password:
    file: ./secrets/postgres-app-password
  grafana-admin-password:
    file: ./secrets/grafana-admin-password
