syntax = "proto3";

package imperator.proto;

import "google/protobuf/timestamp.proto";

message Cost {
  string id = 1;
  string resource_id = 2;
  double amount = 3;
  string currency = 4;
  google.protobuf.Timestamp period_start = 5;
  google.protobuf.Timestamp period_end = 6;
  map<string, string> metadata = 7;
}
