version: 2

updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/infra/docker"
    schedule:
      interval: weekly
      day: monday
      time: "07:45"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: "/infra/docker/backend"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: "/infra/docker/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
