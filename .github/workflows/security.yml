name: Security

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-security:
    name: Source, dependency and configuration scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          hide-progress: true
          skip-dirs: frontend/node_modules,frontend/.next,target
          skip-files: infra/docker/backend/Dockerfile.dockerignore,infra/docker/frontend/Dockerfile.dockerignore,infra/docker/postgresql/Dockerfile.dockerignore

  history-secrets:
    name: Full Git history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/gitleaks"
          archive="${install_dir}/gitleaks.tar.gz"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$install_dir" gitleaks
          "$install_dir/gitleaks" version

      - name: Scan complete Git history with redaction
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitleaks/gitleaks" detect \
            --source . \
            --redact \
            --no-banner \
            --exit-code 1

  application-images:
    name: Application and migration image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build backend image
        run: >-
          docker build
          --file infra/docker/backend/Dockerfile
          --build-arg VCS_REF=${{ github.sha }}
          --tag imperator/backend:${{ github.sha }}
          .

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: imperator/backend:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          hide-progress: true

      - name: Build frontend image
        run: >-
          docker build
          --file infra/docker/frontend/Dockerfile
          --build-arg VCS_REF=${{ github.sha }}
          --tag imperator/frontend:${{ github.sha }}
          .

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: imperator/frontend:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          hide-progress: true

      - name: Build PostgreSQL-only Flyway image
        run: >-
          docker build
          --file infra/docker/flyway/Dockerfile
          --build-arg VCS_REF=${{ github.sha }}
          --tag imperator/flyway:${{ github.sha }}
          infra/docker/flyway

      - name: Scan PostgreSQL-only Flyway image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: imperator/flyway:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          hide-progress: true

  observability-images:
    name: Observability D096 supply-chain gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PROMETHEUS_IMAGE: prom/prometheus:v3.13.3-distroless@sha256:2e9a8ad75536755572d703e645fcc39c8104d9f0215d49d613db35194b0d8bc2
      GRAFANA_IMAGE: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Prepare D096 evidence and verify image pins
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path build/d096 | Out-Null

          $compose = Get-Content -Raw infra/docker/compose.yaml
          foreach ($image in @($env:PROMETHEUS_IMAGE, $env:GRAFANA_IMAGE)) {
            if (-not $compose.Contains("image: $image")) {
              throw "The D096 workflow image does not match Compose: $image"
            }
          }

          @(
            "sourceRevision=${{ github.sha }}"
            "runnerOS=${{ runner.os }}"
            "runnerArchitecture=${{ runner.arch }}"
            "docker=$(docker --version)"
            "trivy=$(trivy --version | Select-Object -First 1)"
          ) | Set-Content -Encoding utf8 build/d096/ci-environment.txt

      - name: Validate Prometheus configuration and alert transitions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /bin/promtool \
            --volume "$PWD/infra/docker/observability/prometheus:/etc/prometheus:ro" \
            "$PROMETHEUS_IMAGE" \
            check config /etc/prometheus/prometheus.yml \
            | tee build/d096/promtool-config.txt
          docker run --rm \
            --entrypoint /bin/promtool \
            --volume "$PWD/infra/docker/observability/prometheus:/etc/prometheus:ro" \
            "$PROMETHEUS_IMAGE" \
            test rules /etc/prometheus/tests/imperator-alerts.test.yml \
            | tee build/d096/promtool-alert-transitions.txt

      - name: Scan D096 runtime images
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $reports = [ordered]@{}
          $images = [ordered]@{
            prometheus = $env:PROMETHEUS_IMAGE
            grafana = $env:GRAFANA_IMAGE
          }

          foreach ($entry in $images.GetEnumerator()) {
            docker pull $entry.Value | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to pull $($entry.Key) image."
            }

            $reportPath = "build/d096/trivy-$($entry.Key).json"
            trivy image `
              --scanners vuln,secret `
              --severity HIGH,CRITICAL `
              --ignore-unfixed `
              --format json `
              --output $reportPath `
              $entry.Value
            if ($LASTEXITCODE -ne 0) {
              throw "Trivy could not scan $($entry.Key)."
            }

            $report = Get-Content -Raw $reportPath | ConvertFrom-Json
            $vulnerabilities = @(
              $report.Results |
                ForEach-Object { @($_.Vulnerabilities) } |
                Where-Object { $null -ne $_ }
            )
            $secrets = @(
              $report.Results |
                ForEach-Object { @($_.Secrets) } |
                Where-Object { $null -ne $_ }
            )
            $reports[$entry.Key] = [ordered]@{
              image = $entry.Value
              imageId = docker image inspect --format '{{.Id}}' $entry.Value
              fixableHighCriticalCount = $vulnerabilities.Count
              secretCount = $secrets.Count
              findings = @(
                $vulnerabilities |
                  Select-Object VulnerabilityID, PkgName, InstalledVersion,
                    FixedVersion, Severity -Unique
              )
            }
            Remove-Item -LiteralPath $reportPath
          }

          $reports | ConvertTo-Json -Depth 6 |
            Set-Content -Encoding utf8 build/d096/image-scan-summary.json
          $failed = @(
            $reports.Values |
              Where-Object {
                $_.fixableHighCriticalCount -ne 0 -or $_.secretCount -ne 0
              }
          )
          if ($failed.Count -ne 0) {
            throw "D096 requires zero fixable High/Critical findings and zero secrets."
          }

      - name: Record scan database metadata
        if: always()
        shell: pwsh
        run: |
          trivy --version |
            Set-Content -Encoding utf8 build/d096/trivy-database-metadata.txt

      - name: Preserve D096 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d096-observability-supply-chain-${{ github.sha }}
          path: build/d096
          if-no-files-found: error
          retention-days: 14

  postgresql-runtime-image:
    name: PostgreSQL D094 supply-chain gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Prepare D094 diagnostic evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/d094 | Out-Null
          @(
            "sourceRevision=${{ github.sha }}"
            "runnerOS=${{ runner.os }}"
            "runnerArchitecture=${{ runner.arch }}"
            "docker=$(docker --version)"
            "buildx=$(docker buildx version)"
            "trivy=$(trivy --version | Select-Object -First 1)"
          ) | Set-Content -Encoding utf8 build/d094/ci-environment.txt

      - name: Enable containerd image store
        shell: bash
        run: |
          set -euo pipefail

          daemon_config=/etc/docker/daemon.json
          temporary_config=$(mktemp)

          if sudo test -f "$daemon_config"; then
            sudo cat "$daemon_config" |
              jq '.features = (.features // {}) | .features["containerd-snapshotter"] = true' \
              > "$temporary_config"
          else
            jq -n '{"features":{"containerd-snapshotter":true}}' \
              > "$temporary_config"
          fi

          sudo install -m 0644 "$temporary_config" "$daemon_config"
          rm -f "$temporary_config"
          sudo systemctl restart docker

          for attempt in {1..30}; do
            if docker info >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Docker did not become ready after enabling the containerd image store." >&2
              exit 1
            fi
            sleep 1
          done

          driver_status=$(docker info --format '{{json .DriverStatus}}')
          echo "$driver_status"
          grep -q 'io.containerd.snapshotter.v1' <<< "$driver_status"
          printf 'dockerDriverStatus=%s\n' "$driver_status" \
            >> build/d094/ci-environment.txt

      - name: Configure attestation-capable Buildx builder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          docker buildx create `
            --name imperator-d094 `
            --driver docker-container `
            --use
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create the D094 Buildx builder."
          }
          docker buildx inspect --bootstrap
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to bootstrap the D094 Buildx builder."
          }
          $builderInfo = @(docker buildx inspect)
          if ($LASTEXITCODE -ne 0 -or
              -not ($builderInfo -match '^Driver:\s+docker-container\s*$')) {
            throw "D094 requires the docker-container Buildx driver."
          }
          "buildxDriver=docker-container" |
            Add-Content -Encoding utf8 build/d094/ci-environment.txt

      - name: Build and certify PostgreSQL runtime image
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          try {
            ./scripts/verify-postgres-runtime-image.ps1 `
              -EvidenceDirectory build/d094/first `
              -RequireCleanWorktree
            $runtimeDigest = (Get-Content -Raw build/d094/first/provenance.json |
              ConvertFrom-Json).runtimeManifestDigest
            ./scripts/verify-postgres-runtime-image.ps1 `
              -EvidenceDirectory build/d094/rebuild `
              -ExpectedRuntimeDigest $runtimeDigest `
              -RequireCleanWorktree
          } catch {
            ($_ | Format-List * -Force | Out-String) |
              Set-Content -Encoding utf8 build/d094/ci-failure.txt
            throw
          }

      - name: Preserve D094 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d094-postgresql-supply-chain-${{ github.sha }}
          path: build/d094
          if-no-files-found: error
          retention-days: 30
