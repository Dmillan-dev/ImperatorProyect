name: Security

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-security:
    name: Source, dependency and configuration scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert deferred monitoring runtime is absent
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $deferredDirectory = "infra/docker/observability"
          if (Test-Path -LiteralPath $deferredDirectory) {
            throw "D097 forbids active external monitoring assets: $deferredDirectory"
          }

          $runtimeInputs = @(
            "infra/docker/compose.yaml"
            "infra/docker/.env.example"
            "infra/docker/secrets/README.md"
          )
          $forbiddenPatterns = [ordered]@{
            monitoringService = '(?m)^\s{2}(prometheus|grafana|alertmanager):\s*$'
            monitoringProfile = '(?m)^\s+-\s+observability\s*$'
            monitoringNetwork = '(?m)^\s{2}observability-internal:\s*$'
            monitoringVolume = '(?m)^\s{2}prometheus-data:\s*$'
            grafanaPort = 'IMPERATOR_' + 'GRAFANA_PORT'
            grafanaSecret = 'grafana-' + 'admin-password'
          }
          foreach ($path in $runtimeInputs) {
            $content = Get-Content -Raw -LiteralPath $path
            foreach ($entry in $forbiddenPatterns.GetEnumerator()) {
              if ($content -match $entry.Value) {
                throw "D097 found forbidden $($entry.Key) in $path"
              }
            }
          }

          Write-Output "D097 deferred monitoring runtime assertion: PASS"

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          hide-progress: true
          skip-dirs: frontend/node_modules,frontend/.next,target
          skip-files: infra/docker/backend/Dockerfile.dockerignore,infra/docker/frontend/Dockerfile.dockerignore,infra/docker/postgresql/Dockerfile.dockerignore

  history-secrets:
    name: Full Git history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/gitleaks"
          archive="${install_dir}/gitleaks.tar.gz"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$install_dir" gitleaks
          "$install_dir/gitleaks" version

      - name: Scan complete Git history with redaction
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitleaks/gitleaks" detect \
            --source . \
            --redact \
            --no-banner \
            --exit-code 1

  application-images:
    name: Application image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build backend image
        run: >-
          docker build
          --file infra/docker/backend/Dockerfile
          --build-arg VCS_REF=${{ github.sha }}
          --tag imperator/backend:${{ github.sha }}
          .

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: imperator/backend:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          hide-progress: true

      - name: Build frontend image
        run: >-
          docker build
          --file infra/docker/frontend/Dockerfile
          --build-arg VCS_REF=${{ github.sha }}
          --tag imperator/frontend:${{ github.sha }}
          .

      - name: Verify frontend runtime security patch
        shell: bash
        run: |
          set -euo pipefail
          actual_version=$(docker run --rm \
            --entrypoint dpkg-query \
            imperator/frontend:${{ github.sha }} \
            '--showformat=${Version}' \
            --show libpcre2-8-0)
          test "$actual_version" = "10.42-1+deb12u1"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: imperator/frontend:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          hide-progress: true

  postgresql-runtime-image:
    name: PostgreSQL D094 supply-chain gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Prepare D094 diagnostic evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/d094 | Out-Null
          @(
            "sourceRevision=${{ github.sha }}"
            "runnerOS=${{ runner.os }}"
            "runnerArchitecture=${{ runner.arch }}"
            "docker=$(docker --version)"
            "buildx=$(docker buildx version)"
            "trivy=$(trivy --version | Select-Object -First 1)"
          ) | Set-Content -Encoding utf8 build/d094/ci-environment.txt

      - name: Enable containerd image store
        shell: bash
        run: |
          set -euo pipefail

          daemon_config=/etc/docker/daemon.json
          temporary_config=$(mktemp)

          if sudo test -f "$daemon_config"; then
            sudo cat "$daemon_config" |
              jq '.features = (.features // {}) | .features["containerd-snapshotter"] = true' \
              > "$temporary_config"
          else
            jq -n '{"features":{"containerd-snapshotter":true}}' \
              > "$temporary_config"
          fi

          sudo install -m 0644 "$temporary_config" "$daemon_config"
          rm -f "$temporary_config"
          sudo systemctl restart docker

          for attempt in {1..30}; do
            if docker info >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Docker did not become ready after enabling the containerd image store." >&2
              exit 1
            fi
            sleep 1
          done

          driver_status=$(docker info --format '{{json .DriverStatus}}')
          echo "$driver_status"
          grep -q 'io.containerd.snapshotter.v1' <<< "$driver_status"
          printf 'dockerDriverStatus=%s\n' "$driver_status" \
            >> build/d094/ci-environment.txt

      - name: Configure attestation-capable Buildx builder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          docker buildx create `
            --name imperator-d094 `
            --driver docker-container `
            --use
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create the D094 Buildx builder."
          }
          docker buildx inspect --bootstrap
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to bootstrap the D094 Buildx builder."
          }
          $builderInfo = @(docker buildx inspect)
          if ($LASTEXITCODE -ne 0 -or
              -not ($builderInfo -match '^Driver:\s+docker-container\s*$')) {
            throw "D094 requires the docker-container Buildx driver."
          }
          "buildxDriver=docker-container" |
            Add-Content -Encoding utf8 build/d094/ci-environment.txt

      - name: Build and certify PostgreSQL runtime image
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          try {
            ./scripts/verify-postgres-runtime-image.ps1 `
              -EvidenceDirectory build/d094/first `
              -RequireCleanWorktree
            $runtimeDigest = (Get-Content -Raw build/d094/first/provenance.json |
              ConvertFrom-Json).runtimeManifestDigest
            ./scripts/verify-postgres-runtime-image.ps1 `
              -EvidenceDirectory build/d094/rebuild `
              -ExpectedRuntimeDigest $runtimeDigest `
              -RequireCleanWorktree
          } catch {
            ($_ | Format-List * -Force | Out-String) |
              Set-Content -Encoding utf8 build/d094/ci-failure.txt
            throw
          }

      - name: Preserve D094 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d094-postgresql-supply-chain-${{ github.sha }}
          path: build/d094
          if-no-files-found: error
          retention-days: 30
