name: Security

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-security:
    name: Source, dependency and configuration scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          hide-progress: true
          skip-dirs: frontend/node_modules,frontend/.next,target
          skip-files: infra/docker/backend/Dockerfile.dockerignore,infra/docker/frontend/Dockerfile.dockerignore,infra/docker/postgresql/Dockerfile.dockerignore

  application-images:
    name: Application image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build backend image
        run: >-
          docker build
          --file infra/docker/backend/Dockerfile
          --build-arg VCS_REF=${{ github.sha }}
          --tag imperator/backend:${{ github.sha }}
          .

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: imperator/backend:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          hide-progress: true

      - name: Build frontend image
        run: >-
          docker build
          --file infra/docker/frontend/Dockerfile
          --build-arg VCS_REF=${{ github.sha }}
          --tag imperator/frontend:${{ github.sha }}
          .

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: imperator/frontend:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          hide-progress: true

  postgresql-runtime-image:
    name: PostgreSQL D094 supply-chain gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.74.0
          cache: true

      - name: Prepare D094 diagnostic evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/d094 | Out-Null
          @(
            "sourceRevision=${{ github.sha }}"
            "runnerOS=${{ runner.os }}"
            "runnerArchitecture=${{ runner.arch }}"
            "docker=$(docker --version)"
            "buildx=$(docker buildx version)"
            "trivy=$(trivy --version | Select-Object -First 1)"
          ) | Set-Content -Encoding utf8 build/d094/ci-environment.txt

      - name: Enable containerd image store
        shell: bash
        run: |
          set -euo pipefail

          daemon_config=/etc/docker/daemon.json
          temporary_config=$(mktemp)

          if sudo test -f "$daemon_config"; then
            sudo cat "$daemon_config" |
              jq '.features = (.features // {}) | .features["containerd-snapshotter"] = true' \
              > "$temporary_config"
          else
            jq -n '{"features":{"containerd-snapshotter":true}}' \
              > "$temporary_config"
          fi

          sudo install -m 0644 "$temporary_config" "$daemon_config"
          rm -f "$temporary_config"
          sudo systemctl restart docker

          for attempt in {1..30}; do
            if docker info >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Docker did not become ready after enabling the containerd image store." >&2
              exit 1
            fi
            sleep 1
          done

          driver_status=$(docker info --format '{{json .DriverStatus}}')
          echo "$driver_status"
          grep -q 'io.containerd.snapshotter.v1' <<< "$driver_status"
          printf 'dockerDriverStatus=%s\n' "$driver_status" \
            >> build/d094/ci-environment.txt

      - name: Configure attestation-capable Buildx builder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          docker buildx create `
            --name imperator-d094 `
            --driver docker-container `
            --use
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create the D094 Buildx builder."
          }
          docker buildx inspect --bootstrap
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to bootstrap the D094 Buildx builder."
          }
          $builderInfo = @(docker buildx inspect)
          if ($LASTEXITCODE -ne 0 -or
              -not ($builderInfo -match '^Driver:\s+docker-container\s*$')) {
            throw "D094 requires the docker-container Buildx driver."
          }
          "buildxDriver=docker-container" |
            Add-Content -Encoding utf8 build/d094/ci-environment.txt

      - name: Build and certify PostgreSQL runtime image
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          try {
            ./scripts/verify-postgres-runtime-image.ps1 `
              -EvidenceDirectory build/d094/first `
              -RequireCleanWorktree
            $runtimeDigest = (Get-Content -Raw build/d094/first/provenance.json |
              ConvertFrom-Json).runtimeManifestDigest
            ./scripts/verify-postgres-runtime-image.ps1 `
              -EvidenceDirectory build/d094/rebuild `
              -ExpectedRuntimeDigest $runtimeDigest `
              -RequireCleanWorktree
          } catch {
            ($_ | Format-List * -Force | Out-String) |
              Set-Content -Encoding utf8 build/d094/ci-failure.txt
            throw
          }

      - name: Preserve D094 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d094-postgresql-supply-chain-${{ github.sha }}
          path: build/d094
          if-no-files-found: error
          retention-days: 30
