name: AWS IaC

on:
  pull_request:
    paths:
      - ".github/workflows/aws-iac.yml"
      - "infra/aws/terraform/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/aws-iac.yml"
      - "infra/aws/terraform/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform format, validate and offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TERRAFORM_VERSION: 1.16.3
      TERRAFORM_LINUX_AMD64_SHA256: 093b6ae9a2228af5029c41606bc96eb583553528aad1bfe7e0b4d62fc91e25d8

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install checksum-pinned Terraform
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/terraform.zip"
          install_dir="${RUNNER_TEMP}/terraform"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          printf '%s  %s\n' "$TERRAFORM_LINUX_AMD64_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Verify bootstrap stack
        shell: bash
        working-directory: infra/aws/terraform/bootstrap
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
          terraform test -no-color

      - name: Verify pilot stack
        shell: bash
        working-directory: infra/aws/terraform/pilot
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
          terraform test -no-color
