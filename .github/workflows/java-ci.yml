name: Java CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Java 21 Maven verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify build runtime
        shell: bash
        run: |
          set -euo pipefail
          test -x ./mvnw
          grep -Fx 'wrapperVersion=3.3.4' .mvn/wrapper/maven-wrapper.properties
          grep -Fx 'distributionSha256Sum=5af3b743dd8b876b5c45da33b676251e5f1687712644abb4ee519ca56e1d89ce' .mvn/wrapper/maven-wrapper.properties
          maven_output="$(./mvnw --version)"
          printf '%s\n' "$maven_output"
          grep -F 'Apache Maven 3.9.16' <<< "$maven_output"
          grep -E 'Java version: 21([.,]|$)' <<< "$maven_output"
          grep -F 'vendor: Eclipse Adoptium' <<< "$maven_output"

      - name: Build and verify
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
