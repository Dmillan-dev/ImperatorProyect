name: Proto CI

on:
  push:
    paths:
      - 'proto/**'
      - '.github/workflows/proto-ci.yml'

jobs:
  generate-bindings:
    name: Generate and verify proto bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler curl unzip
          python -m pip install --upgrade pip
          pip install grpcio-tools

      - name: Download protoc-gen-grpc-java
        run: |
          set -e
          VERSION=1.57.0
          ARCH=linux-x86_64
          URL="https://repo1.maven.org/maven2/io/grpc/protoc-gen-grpc-java/${VERSION}/protoc-gen-grpc-java-${VERSION}-${ARCH}.exe"
          curl -fSLo protoc-gen-grpc-java "$URL"
          chmod +x protoc-gen-grpc-java
          sudo mv protoc-gen-grpc-java /usr/local/bin/

      - name: Generate Python bindings
        run: |
          mkdir -p build/gen/python
          python -m grpc_tools.protoc -Iproto --python_out=build/gen/python --grpc_python_out=build/gen/python proto/*.proto

      - name: Generate Java bindings
        run: |
          mkdir -p build/gen/java
          protoc -Iproto --java_out=build/gen/java proto/*.proto
          protoc -Iproto --grpc-java_out=build/gen/java --plugin=protoc-gen-grpc-java=/usr/local/bin/protoc-gen-grpc-java proto/*.proto || true

      - name: Verify generation
        run: |
          echo "Generated files:"
          ls -R build/gen || true
